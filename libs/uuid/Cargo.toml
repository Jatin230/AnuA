[package]
name = "uuid"
version = "1.16.0"
edition = "2018"
description = "A library to generate and parse UUIDs."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/uuid-rs/uuid"

[features]
default = ["std"]
std = []
v4 = ["rng"]
v1 = ["atomic"]
v3 = ["md5"]
v5 = ["sha1"]
v6 = ["atomic"]
v7 = ["rng"]
v8 = []
rng = ["dep:getrandom"]
fast-rng = ["rng", "dep:rand"]
sha1 = []
md5 = ["dep:md-5"]
atomic = ["dep:atomic"]

[dependencies.getrandom]
version = "0.3"
optional = true

[dependencies.rand]
version = "0.8"
optional = true
default-features = false
features = ["std_rng"]

[dependencies.md-5]
version = "0.10"
optional = true
default-features = false

[dependencies.atomic]
version = "0.5"
optional = true
default-features = false

[dependencies.serde]
version = "1"
optional = true
default-features = false

