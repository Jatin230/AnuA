import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.gradle.api.tasks.compile.JavaCompile

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
    if (project.name == 'uni_links') {
        project.plugins.withId('com.android.library') {
            project.android {
                namespace 'name.avioli.unilinks'
            }
        }
    }
}

gradle.projectsEvaluated {
    subprojects { subproject ->
        subproject.tasks.withType(KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = '11'
        }
        subproject.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = '11'
            targetCompatibility = '11'
        }
        def androidExtension = subproject.extensions.findByName('android')
        if (androidExtension != null && androidExtension.hasProperty('compileOptions')) {
            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
