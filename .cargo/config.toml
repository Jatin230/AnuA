# Pin the MSVC linker to VS 2022 stable (14.44.x).
# This prevents Rust from accidentally using VS "18" Preview (14.50.x)
# which is incompatible with the prebuilt libsodium / scrap codec libs.
[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\bin\\HostX64\\x64\\link.exe"
