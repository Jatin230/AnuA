

[package]
name = "anuvadini"
version = "1.3.0"
authors = ["anuvadini <js8160303@gmail.com>"]
edition = "2021"
build= "build.rs"
description = "Anuvadini Remote Desktop"
default-run = "anuvadini"
rust-version = "1.75"

[lib]
name = "anuvadini"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "naming"
path = "src/naming.rs"

[[bin]]
name = "service"
path = "src/service.rs"

[features]
inline = []
cli = []
use_samplerate = ["samplerate"]
use_rubato = ["rubato"]
use_dasp = ["dasp"]
flutter = ["flutter_rust_bridge"]
default = ["use_dasp", "flutter", "webrtc"]
hwcodec = ["scrap/hwcodec"]
vram = ["scrap/vram"]
mediacodec = ["scrap/mediacodec"]
plugin_framework = []
linux-pkg-config = ["magnum-opus/linux-pkg-config", "scrap/linux-pkg-config"]
unix-file-copy-paste = [
    "dep:x11-clipboard",
    "dep:x11rb",
    "dep:percent-encoding",
    "dep:once_cell",
    "clipboard/unix-file-copy-paste",
]
screencapturekit = ["cpal/screencapturekit"]
webrtc = ["hbb_common/webrtc"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { path = "libs/async-trait" }
scrap = { path = "libs/scrap", features = ["wayland"] }
hbb_common = { path = "libs/hbb_common" }
serde_derive = { path = "libs/serde_derive" }
serde = { path = "libs/serde" }
serde_json = { path = "libs/serde_json" }
serde_repr = { path = "libs/serde_repr" }
cfg-if = { path = "libs/cfg-if" }
lazy_static = { path = "libs/lazy_static" }
sha2 = { path = "libs/sha2" }
repng = { path = "libs/repng" }
nostr-sdk = { path = "libs/nostr-sdk" }
parity-tokio-ipc = { path = "libs/parity-tokio-ipc" }
magnum-opus = { path = "libs/magnum-opus" }
dasp = { path = "libs/dasp", features = ["signal", "interpolate-linear", "interpolate"], optional = true }
rubato = { path = "libs/rubato", optional = true }
samplerate = { path = "libs/samplerate", optional = true }
uuid = { path = "libs/uuid", features = ["v4"] }
clap = { path = "libs/clap" }
rpassword = { path = "libs/rpassword" }
num_cpus = { path = "libs/num_cpus" }
bytes = { path = "libs/bytes", features = ["serde"] }
default-net = { path = "libs/default-net" }
wol-rs = { path = "libs/wol-rs" }
flutter_rust_bridge = { path = "libs/flutter_rust_bridge", features = ["uuid"], optional = true}
errno = { path = "libs/errno" }
rdev = { path = "libs/rdev" }
url = { path = "libs/url", features = ["serde"] }
crossbeam-queue = { path = "libs/crossbeam-queue" }
hex = { path = "libs/hex" }
chrono = { path = "libs/chrono" }
cidr-utils = { path = "libs/cidr-utils" }
fon = { path = "libs/fon" }
zip = { path = "libs/zip" }
shutdown_hooks = { path = "libs/shutdown_hooks" }
totp-rs = { path = "libs/totp-rs", default-features = false, features = ["gen_secret", "otpauth"] }
stunclient = { path = "libs/stunclient" }
kcp-sys= { path = "libs/kcp-sys" }
reqwest = { path = "libs/reqwest", features = ["blocking", "socks", "json", "native-tls", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features=false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# https://github.com/anuvadini/anuvadini/discussions/10197, not use cpal on linux
cpal = { path = "libs/cpal" }
ringbuf = { path = "libs/ringbuf" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mac_address = { path = "libs/mac_address" }
sciter-rs = { path = "libs/sciter-rs" }
sys-locale = { path = "libs/sys-locale" }
enigo = { path = "libs/enigo", features = [ "with_serde" ] }
clipboard = { path = "libs/clipboard" }
ctrlc = { path = "libs/ctrlc" }
# arboard = { version = "3.4", features = ["wayland-data-control"] }
arboard = { path = "libs/arboard", features = ["wayland-data-control"] }
clipboard-master = { path = "libs/clipboard-master" }
portable-pty = { path = "libs/portable-pty/pty" }


system_shutdown = { path = "libs/system_shutdown" }
qrcode-generator = { path = "libs/qrcode-generator" }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { path = "libs/winapi", features = [
    "winuser",
    "wincrypt",
    "shellscalingapi",
    "pdh",
    "synchapi",
    "memoryapi",
    "shellapi",
    "devguid",
    "setupapi",
    "cguid",
    "cfgmgr32",
    "ioapiset",
    "winspool",
] }
windows = { path = "libs/windows", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
winreg = { path = "libs/winreg" }
windows-service = { path = "libs/windows-service" }
virtual_display = { path = "libs/virtual_display" }
remote_printer = { path = "libs/remote_printer" }
impersonate_system = { path = "libs/impersonate-system" }
shared_memory = { path = "libs/shared_memory" }
tauri-winrt-notification = { path = "libs/tauri-winrt-notification" }
runas = { path = "libs/runas" }

[target.'cfg(target_os = "macos")'.dependencies]
objc = { path = "libs/objc" }
cocoa = { path = "libs/cocoa" }
dispatch = { path = "libs/dispatch" }
core-foundation = { path = "libs/core-foundation" }
core-graphics = { path = "libs/core-graphics" }
include_dir = { path = "libs/include_dir" }
fruitbasket = { path = "libs/fruitbasket" }
objc_id = { path = "libs/objc_id" }
# If we use piet "0.7" here, we must also update core-graphics to "0.24".
piet = { path = "libs/piet" }
piet-coregraphics = { path = "libs/piet-coregraphics" }
foreign-types = { path = "libs/foreign-types" }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tray-icon = { path = "libs/tray-icon", version = "0.24.0" }
tao = { path = "libs/tao" }
image = { path = "libs/image" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keepawake = { path = "libs/keepawake" }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
wallpaper = { path = "libs/wallpaper" }
tiny-skia = { path = "libs/tiny-skia" }
softbuffer = { path = "libs/softbuffer" }
fontdb = { path = "libs/fontdb" }
bytemuck = { path = "libs/bytemuck" }
ttf-parser = { path = "libs/ttf-parser" }

[target.'cfg(target_os = "linux")'.dependencies]
libxdo-sys = { path = "libs/libxdo-sys-stub" }
psimple = { package = "libpulse-simple-binding", path = "libs/psimple" }
pulse = { package = "libpulse-binding", path = "libs/pulse" }
rust-pulsectl = { path = "libs/rust-pulsectl" }
async-process = { path = "libs/async-process" }
evdev = { path = "libs/evdev" }
dbus = { path = "libs/dbus" }
dbus-crossroads = { path = "libs/dbus-crossroads" }
pam = { path = "libs/pam" }
x11-clipboard = { path = "libs/x11-clipboard", optional = true }
x11rb =  {version = "0.12", features = ["all-extensions"], optional = true}
percent-encoding = {version = "2.3", optional = true}
once_cell = {version = "1.18", optional = true}
nix = { version = "0.29", features = ["term", "process"]}
gtk = { path = "libs/gtk" }
termios = { path = "libs/termios" }
terminfo = { path = "libs/terminfo" }
winit = { path = "libs/winit" }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { path = "libs/android_logger" }
jni = { path = "libs/jni" }
android-wakelock = { path = "libs/android-wakelock" }

[workspace]
members = ["libs/scrap", "libs/hbb_common", "libs/enigo", "libs/clipboard", "libs/virtual_display", "libs/virtual_display/dylib", "libs/portable", "libs/remote_printer", "libs/printer_driver_adapter", "libs/printer_driver_render_filter"]
exclude = ["vdi/host", "examples/custom_plugin"]

# Redirect git deps to local paths so Android builds work fully offline
[patch."https://github.com/anuvadini-org/rdev"]
rdev = { path = "libs/rdev" }

[patch."https://github.com/anuvadini-org/The-Fat-Controller"]
tfc = { path = "libs/tfc" }

# Patch libxdo-sys to use a stub implementation that doesn't require libxdo
# This allows building and running on systems without libxdo installed (e.g., Wayland-only)
[patch.crates-io]
libxdo-sys = { path = "libs/libxdo-sys-stub" }
cfg-if = { path = "libs/cfg-if" }
serde = { path = "libs/serde" }
serde_derive = { path = "libs/serde_derive" }
serde_json = { path = "libs/serde_json" }
serde_repr = { path = "libs/serde_repr" }
async-trait = { path = "libs/async-trait" }
