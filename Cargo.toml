stunclient = { path = "libs/stunclient" }
wol-rs = { path = "libs/wol-rs" }
fon = { path = "libs/fon" }
cidr-utils = { path = "libs/cidr-utils" }
shutdown_hooks = { path = "libs/shutdown_hooks" }
rubato = { path = "libs/rubato" }
samplerate = { path = "libs/samplerate" }
dasp = { path = "libs/dasp" }
rpassword = { path = "libs/rpassword" }
flutter_rust_bridge = { path = "libs/flutter_rust_bridge" }
ringbuf = { path = "libs/ringbuf" }
mac_address = { path = "libs/mac_address" }
sys-locale = { path = "libs/sys-locale" }
ctrlc = { path = "libs/ctrlc" }
system_shutdown = { path = "libs/system_shutdown" }
qrcode-generator = { path = "libs/qrcode-generator" }
winreg = { path = "libs/winreg" }
windows-service = { path = "libs/windows-service" }
shared_memory = { path = "libs/shared_memory" }
tauri-winrt-notification = { path = "libs/tauri-winrt-notification" }
runas = { path = "libs/runas" }
objc = { path = "libs/objc" }
cocoa = { path = "libs/cocoa" }
dispatch = { path = "libs/dispatch" }
core-foundation = { path = "libs/core-foundation" }
core-graphics = { path = "libs/core-graphics" }
