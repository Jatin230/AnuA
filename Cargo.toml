[package.metadata.winres]
LegalCopyright = "Copyright © 2025 Purslane Ltd. All rights reserved."
ProductName = "Anuvadini"
FileDescription = "Anuvadini Remote Desktop"
OriginalFilename = "Anuvadini.exe"

[target.'cfg(target_os="windows")'.build-dependencies]
winres = { path = "libs/winres" }
winapi = { path = "libs/winapi", features = [ "winnt", "pdh", "synchapi" ] }

[build-dependencies]
cc = { path = "libs/cc" }
hbb_common = { path = "libs/hbb_common" }
os-version = { path = "libs/os-version" }

[dev-dependencies]
hound = { path = "libs/hound" }
docopt = { path = "libs/docopt" }

[package.metadata.bundle]
name = "Anuvadini"
identifier = "com.carriez.anuvadini"
icon = ["res/32x32.png", "res/128x128.png", "res/128x128@2x.png"]
osx_minimum_system_version = "10.14"

#https://github.com/johnthagen/min-sized-rust
[profile.release]
lto = "thin"
codegen-units = 4
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip
rpath = true

